<!DOCTYPE html>

<html>

<head>
    <title>My first Website</title>
</head>

<body>
    <!--Contoh comment-->
    <h1>This is the Title of my website</h1>
    <hr> <!-- hr = buat spasi antar paragraph, biar rapih aja. hr = self closing tag-->
    <p>Click the link below to see the greatest of all time :)</p>
    <a href="https://www.youtube.com/@spab123" target="_blank" title="You won't regret it!">
        Youtube
    </a>
    <br> <!-- hr = buat spasi antar paragraph, biar rapih aja. hr = self closing tag-->
    <img src="Logo sepatu.png" height="300">
    <video controls src="Vem Vem (Slowed x Blue Lock Edit) - Jmilton - DJ CXRTOON 3 (720p, h264).mp4" width="300">

    <p id="p1"> Examples without table </p>
    <h4>Unordered List</h4>
    <ul> <!-- ul = unordered list-->
        <li>Kecap</li>
        <li>Beras</li>
    </ul>

    <button style="font-size:25px; border-radius: 5px;">Click Me</button>
    <h4>Ordered List</h4>
    <ol type="A"> <!-- ol = ordered list-->
        <li>Push Up</li>
    </ol>

    <h4>Description List</h4>
    <dl> <!-- dl = description list-->
       <dt>HTML <!-- dt = description term-->
        <dd>testtt</dd> <!-- dd = description definition-->
    </dt> 
    </dl>

    <p id="p2"> Examples with table</p>
    <table bgcolor="black" width="700">
        <tr bgcolor="yellow" width="100"> <!-- tr = table row-->
            <th>Senin</th> <!-- th = table header-->
            <th>Selasa</th>
            <th>Rabu</th>
            <th>Kamis</th>
            <th>Jumat</th>
            <th>Sabtu</th>
            <th>Minggu</th>
        </tr>
        <tr bgcolor="grey" align="center">
            <td>9-5</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>Closed</td>
            <td>Closed</td>
        </tr>
    </table>
</body>

</html>
